        '409':
          description: Slot code already exists on this floor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Parking Slots]
      summary: Delete parking slot (admin) — blocked if active session exists
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '204':
          description: Deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Slot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cannot delete slot with an active parking session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

