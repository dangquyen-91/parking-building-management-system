                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Parking Slots]
      summary: Create a new parking slot (admin, manager) — car floors only
      description: |
        Chi tao duoc tren tang xe hoi (floor.vehicleType = "car").
        Tang xe may dung POST /parking-rows.
        vehicleType phai la "car".
        Tong so slot khong vuot qua floor.totalSlots.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [floorId, slotCode, vehicleType]
              properties:
                floorId:
                  type: integer
                  example: 2
                slotCode:
                  type: string
                  minLength: 1
                  maxLength: 20
                  example: A01
                vehicleType:
                  type: string
                  enum: [car]
                  example: car
                status:
                  type: string
                  enum: [empty, occupied, reserved, maintenance]
                  default: empty
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
      responses:
        '201':
          description: Slot created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ParkingSlot'
        '400':
          description: Validation error, floor is motorcycle type, or floor/building inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Parking slots can only be created on car floors. Use parking rows for motorcycle floors.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Floor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slot code already exists on this floor, or floor at max capacity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /parking-slots/bulk:
    post:
      tags: [Parking Slots]
      summary: Bulk create parking slots (admin, manager) — car floors only
      description: |
        Chi tao duoc tren tang xe hoi (floor.vehicleType = "car").
        Ho tro 2 mode: truyen `quantity` de tu sinh slotCode (A01, A02...), hoac truyen `slots` de chi dinh tuong minh.
        Toan bo chay trong mot transaction — loi 1 slot thi rollback het.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Mode 1 — Auto-generate by quantity
                  type: object
                  required: [floorId, quantity]
                  properties:
                    floorId:
                      type: integer
                      example: 2
                    quantity:
                      type: integer
                      minimum: 1
                      maximum: 200
                      example: 10
                    prefix:
                      type: string
                      maxLength: 5
                      default: A
                      example: A
                    startFrom:
                      type: integer
                      minimum: 1
                      example: 1
                - title: Mode 2 — Explicit slots list
                  type: object
                  required: [floorId, slots]
                  properties:
                    floorId:
                      type: integer
                      example: 2
                    slots:
                      type: array
                      minItems: 1
                      maxItems: 200
                      items:
                        $ref: '#/components/schemas/BulkCreateSlotItem'
            examples:
              autoGenerate:
                summary: 'Mode 1: Tu sinh 10 slot (A01-A10)'
                value:
                  floorId: 2
                  quantity: 10
              autoGenerateWithPrefix:
                summary: 'Mode 1: Tu sinh 5 slot prefix B, bat dau tu 3'
                value:
                  floorId: 2
                  quantity: 5
                  prefix: B
                  startFrom: 3
              explicitSlots:
                summary: 'Mode 2: Danh sach slot tuong minh'
                value:
                  floorId: 2
                  slots:
                    - slotCode: A01
                      vehicleType: car
                    - slotCode: A02
                      vehicleType: car
                    - slotCode: A03
                      vehicleType: car
                      note: Goc tuong
      responses:
        '201':
          description: Tat ca slots duoc tao thanh cong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateSlotsResponse'
        '400':
          description: Validation error, floor is motorcycle type, or floor/building inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Floor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: slotCode da ton tai tren floor, hoac vuot qua capacity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

