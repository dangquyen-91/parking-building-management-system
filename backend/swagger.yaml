          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Floor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slot code already exists on this floor, or floor at max capacity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /parking-slots/bulk:
    post:
      tags: [Parking Slots]
      summary: Bulk create parking slots (admin, manager)
      description: |
        Hỗ trợ 2 mode: truyền `quantity` để tự sinh slotCode (A01, A02…), hoặc truyền `slots` để chỉ định tường minh.
        Toàn bộ chạy trong một transaction — lỗi 1 slot thì rollback hết.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Mode 1 — Auto-generate by quantity
                  type: object
                  required: [floorId, quantity]
                  properties:
                    floorId:
                      type: integer
                      example: 2
                      description: ID của tầng cần tạo slots
                    quantity:
                      type: integer
                      minimum: 1
                      maximum: 200
                      example: 10
                      description: Số lượng slot cần tạo
                    prefix:
                      type: string
                      maxLength: 5
                      default: A
                      example: A
                      description: Tiền tố cho slotCode (mặc định "A" → A01, A02…)
                    startFrom:
                      type: integer
                      minimum: 1
                      example: 1
                      description: Số bắt đầu (mặc định tự tính từ số slot hiện có + 1)
                - title: Mode 2 — Explicit slots list
                  type: object
                  required: [floorId, slots]
                  properties:
                    floorId:
                      type: integer
                      example: 2
                      description: ID của tầng cần tạo slots
                    slots:
                      type: array
                      minItems: 1
                      maxItems: 200
                      items:
                        $ref: '#/components/schemas/BulkCreateSlotItem'
            examples:
              autoGenerate:
                summary: 'Mode 1: Tự sinh 10 slot (A01–A10)'
                value:
                  floorId: 2
                  quantity: 10
              autoGenerateWithPrefix:
                summary: 'Mode 1: Tự sinh 5 slot với prefix B, bắt đầu từ 3'
                value:
                  floorId: 2
                  quantity: 5
                  prefix: B
                  startFrom: 3
              explicitSlots:
                summary: 'Mode 2: Danh sách slot tường minh'
                value:
                  floorId: 2
                  slots:
                    - slotCode: A01
                      vehicleType: motorcycle
                    - slotCode: A02
                      vehicleType: motorcycle
                    - slotCode: A03
                      vehicleType: motorcycle
                      note: Góc tường
      responses:
        '201':
          description: Tất cả slots được tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateSlotsResponse'
        '400':
          description: Validation error, vehicleType mismatch, or floor/building inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                vehicleTypeMismatch:
                  summary: '[Mode 2] vehicleType không khớp với floor'
                  value:
                    success: false
                    message: 'This floor only accepts "motorcycle" slots. Slot "A01" has type "car"'
                duplicateInRequest:
                  summary: '[Mode 2] slotCode trùng trong request'
                  value:
                    success: false
                    message: 'Duplicate slotCode in request: "A01"'
                floorInactive:
                  summary: Floor hoặc Building đang inactive
                  value:
                    success: false
                    message: Floor is inactive
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Floor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: slotCode đã tồn tại trên floor, hoặc vượt quá capacity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                slotCodeConflict:
                  summary: slotCode đã tồn tại
                  value:
                    success: false
                    message: 'Slot code "A01" already exists on this floor'
                capacityExceeded:
                  summary: Vượt quá sức chứa
                  value:
                    success: false
                    message: 'Floor capacity exceeded. Current: 45, adding: 10, max: 50'

