      responses:
        '200': { description: Updated }
    delete:
      tags: [Packages]
      summary: Disable a package (admin, manager) — soft delete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Package disabled }

  # ── SUBSCRIPTIONS (resident buys a package) ───────────
  /subscriptions:
    get:
      tags: [Subscriptions]
      summary: List all subscriptions (admin, manager, staff)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, active, expired, cancelled] }
        - name: licensePlate
          in: query
          schema: { type: string }
      responses:
        '200': { description: List of subscriptions }
    post:
      tags: [Subscriptions]
      summary: Buy a package for a license plate (returns VNPay URL)
      description: |
        Creates a pending subscription + pending payment, returns a VNPay URL.
        The subscription is activated only after the VNPay IPN confirms success.
        Residents buy for themselves; staff/manager/admin may pass `userId` to buy on behalf.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageId, licensePlate]
              properties:
                packageId: { type: integer, example: 1 }
                licensePlate: { type: string, example: 51A-12345 }
                slotId:
                  type: integer
                  description: 'Required for CAR packages (fixed reserved slot on a resident floor). Ignored for motorcycle.'
                  example: 5
                userId: { type: integer, description: 'Privileged roles only — buy on behalf of a resident' }
      responses:
        '201':
          description: Subscription created, payment pending
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          paymentUrl: { type: string }
                          orderId: { type: string }
                          subscriptionId: { type: integer }
                          slotId: { type: integer, nullable: true }
                          amount: { type: integer }
        '400': { description: 'slotId required for car / slot not a car slot / not a resident floor' }
        '404': { description: Package not found or inactive / slot not found }
        '409': { description: Pending purchase already exists, or slot is not available }

  /subscriptions/expire:
    post:
      tags: [Subscriptions]
      summary: Sweep expired/stale subscriptions, free reserved slots (admin, manager)
      description: |
        Cancels pending subscriptions older than 15 minutes and marks active
        subscriptions past their endDate as expired, releasing reserved car slots.
        Intended to be run on a schedule (no cron wired yet).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sweep result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          pendingCancelled: { type: integer }
                          activeExpired: { type: integer }

  /subscriptions/me:
    get:
      tags: [Subscriptions]
      summary: List my subscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, active, expired, cancelled] }
      responses:
        '200': { description: My subscriptions }

  /subscriptions/active:
    get:
      tags: [Subscriptions]
      summary: Check active subscription for a license plate (admin, manager, staff)
      description: Used by the check-out flow to decide whether a resident vehicle is covered.
      security:
        - bearerAuth: []
      parameters:
        - name: licensePlate
          in: query
          required: true
          schema: { type: string, example: 51A-12345 }
      responses:
        '200':
          description: Active subscription or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          active: { type: boolean }
                          subscription: { type: object, nullable: true }

  /subscriptions/{id}:
    get:
      tags: [Subscriptions]
      summary: Get a subscription by id (owner or privileged)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Subscription found }
        '403': { description: Access denied }
        '404': { description: Subscription not found }

  # ── PAYMENTS (VNPay callbacks) ────────────────────────
  /payments/vnpay/return:
    get:
      tags: [Payments]
      summary: VNPay browser return URL (public)
      description: |
        VNPay redirects browser here after checkout. Verifies signature then
        302-redirects to FRONTEND_PAYMENT_RETURN_URL with status query params.
        Does NOT mutate business state (rely on IPN).
      responses:
        '302':
          description: Redirect to frontend with `?status=success|failed&code=<code>&orderId=<id>`

  /payments/vnpay/ipn:
    get:
      tags: [Payments]
      summary: VNPay server-to-server IPN (public)
      description: |
        Called by VNPay backend. Authoritative source for marking payment success/failure.
        Returns VNPay-standard RspCode JSON (NOT the API envelope).
      responses:
        '200':
          description: IPN processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  RspCode:
                    type: string
                    enum: ['00', '01', '02', '04', '97']
                  Message:
                    type: string

  /payments/{orderId}/query:
    get:
      tags: [Payments]
      summary: Reconcile a payment via VNPay queryDr (staff, manager, admin)
      description: |
        Actively asks VNPay for the true status of this order (queryDr) and
        updates the payment + subscription if VNPay reports success while our
        record is still pending. Works WITHOUT IPN/ngrok — use it on localhost
        or for manual reconciliation when an IPN was missed.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reconciliation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderId: { type: string }
                          paid: { type: boolean }
                          queryResponseCode: { type: string }
                          transactionStatus: { type: string, nullable: true }
                          message: { type: string }
                          paymentStatus: { type: string, example: success }
                          subscriptionStatus: { type: string, nullable: true, example: active }
                          amount: { type: integer }
        '400': { description: Original transaction date not recorded for this order }
        '404': { description: Payment not found }

  /payments/{orderId}:
    get:
      tags: [Payments]
      summary: Get payment status by orderId
      description: |
        Tra cuu payment theo orderId. Ownership-aware:
          - admin/manager/staff: doc duoc moi payment
          - user thuong: chi doc payment cua minh (lien ket qua subscription/session/booking.userId)
          - guest payment: chi staff+ doc duoc
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Access denied (not the owner, not staff)
        '404':
          description: Payment not found

  # ── BOOKINGS ──────────────────────────────────────────
  /bookings:
    post:
      tags: [Bookings]
      summary: Tao booking (guest hoac user dang nhap)
      description: |
        Tao booking + tra ve VNPay paymentUrl.
        - **Guest** (khong gui Bearer token): chi can `customerEmail` + `licensePlate` + `startTime` + `endTime`.
          `customerName`/`customerPhone` optional.
        - **User dang nhap**: auto-fill tu profile; body override duoc. `customerEmail` van required.
        - **Cu dan** (user co sub active): chi book duoc plate trong sub cua minh (chong "book ho").

        **Business rules:**
          - Chi booking xe ô tô (`vehicleType='car'`, BE auto-set).
          - Tang visitor car: BE auto-pick floor neu khong truyen `floorId`.
          - Booking "ao" — khong lock slot cu the, nhung confirmed booking chiem virtual capacity (giam slot trong).
          - `startTime` phai trong vong 24h toi va o tuong lai.
          - Thoi luong toi thieu 1 gio.
          - 20% rule: con ≥ 20% slot trong (da tru confirmed bookings) moi nhan booking.
          - Khong duplicate active booking cho cung plate.

        **Payment outcome:**
          - Thanh toan thanh cong → booking `confirmed` (co cho) + gui email xac nhan qua Brevo.
          - Thanh toan that bai → booking `cancelled` (khong co cho).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerEmail, licensePlate, startTime, endTime]
              properties:
                customerEmail:
                  type: string
                  format: email
                  description: Bat buoc. Nhan email xac nhan booking khi thanh toan thanh cong.
                  example: 'khach@gmail.com'
                licensePlate:
                  type: string
                  pattern: '^[A-Z0-9\\-]+$'
                  minLength: 4
                  maxLength: 20
                  example: '30A-12345'
                startTime:
                  type: string
                  format: date-time
                  description: ISO 8601. Phai > now va ≤ now+24h.
                  example: '2026-06-13T10:30:00.000Z'
                endTime:
                  type: string
                  format: date-time
                  description: ISO 8601. Phai > startTime va ≥ startTime+1h.
                  example: '2026-06-13T12:30:00.000Z'
                customerName:
                  type: string
                  description: Optional.
                  example: 'Nguyen Van A'
                customerPhone:
                  type: string
                  pattern: '^\\d{9,15}$'
                  description: Optional.
                  example: '0901234567'
                floorId:
                  type: integer
                  description: Optional. BE auto-pick visitor car floor neu bo trong.
                  example: 9
                note:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Booking tao thanh cong, tra paymentUrl
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          bookingId: { type: integer, example: 13 }
                          amount: { type: integer, example: 60000 }
                          prepaidHours: { type: integer, example: 3 }
                          paymentUrl: { type: string }
                          orderId: { type: string, example: 'BOOK-1780...' }
                          floor:
                            type: object
                            properties:
                              id: { type: integer }
                              floorNumber: { type: integer }
                          breakdown:
                            type: object
                            properties:
                              baseFee: { type: integer }
                              overnightFee: { type: integer }
                              totalFee: { type: integer }
                              mode: { type: string, enum: [hourly] }
                              durationMinutes: { type: integer }
                              overnightNights: { type: integer }
        '400': { description: 'Validation error or time-window violation' }
        '403': { description: 'Resident book ho plate khac' }
        '404': { description: 'Khong co tang visitor car khả dụng' }
        '409': { description: 'Plate da co booking active hoac bai qua tai (<20% trong)' }

    get:
      tags: [Bookings]
      summary: List bookings (staff/manager/admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/queryPage'
        - $ref: '#/components/parameters/queryLimit'
        - name: status
          in: query
          schema: { type: string, enum: [pending, confirmed, cancelled, expired] }
        - name: licensePlate
          in: query
          schema: { type: string }
        - name: startDate
          in: query
          schema: { type: string, format: date-time }
        - name: endDate
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401': { description: 'Unauthorized' }
        '403': { description: 'Forbidden — staff+ only' }

  /bookings/me:
    get:
      tags: [Bookings]
      summary: Booking cua user dang dang nhap
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401': { description: 'Unauthorized' }

  /bookings/{id}:
    get:
      tags: [Bookings]
      summary: Booking detail (owner hoac staff+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403': { description: 'Not the owner, not staff+' }
        '404': { description: 'Not found' }

  /bookings/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Huy booking (KHONG hoan tien)
      description: |
        Owner hoac staff+ huy duoc booking dang `pending` hoac `confirmed`.
        Theo business rule: KHONG hoan tien. Booking chuyen status='cancelled'.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Da huy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403': { description: 'Access denied' }
        '404': { description: 'Booking not found' }
        '409': { description: 'Booking khong o status pending/confirmed' }

  /bookings/expire:
    post:
      tags: [Bookings]
      summary: Sweep mark `expired` cho bookings qua endTime ma chua dung (admin/manager)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Tra ve { expired: N } — so booking duoc mark expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403': { description: 'Forbidden' }

