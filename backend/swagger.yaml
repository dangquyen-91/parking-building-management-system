        '404':
          description: Row not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cannot delete row with an active parking session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

