        vehicleType must match the floor's vehicleType.
        Total slots cannot exceed floor.totalSlots.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [floorId, slotCode, vehicleType]
              properties:
                floorId:
                  type: integer
                  example: 2
                slotCode:
                  type: string
                  minLength: 1
                  maxLength: 20
                  example: A01
                vehicleType:
                  type: string
                  enum: [motorcycle, car]
                  example: motorcycle
                status:
                  type: string
                  enum: [empty, occupied, reserved, maintenance]
                  default: empty
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
      responses:
        '201':
          description: Slot created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ParkingSlot'
