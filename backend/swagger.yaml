openapi: 3.0.3
info:
  title: Parking Building Management API
  description: API for managing parking building operations
  version: 1.0.0

servers:
  - url: http://localhost:5000/api/v1
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        example: 1
    queryPage:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    queryLimit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
    queryIsActive:
      name: isActive
      in: query
      schema:
        type: boolean
    querySortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [ASC, DESC]
        default: DESC

  schemas:
    # -- REPORT --
    ReportDashboard:
      type: object
      properties:
        activeSessions:
          type: object
          properties:
            total: { type: integer, example: 42 }
            motorcycle: { type: integer, example: 28 }
            car: { type: integer, example: 14 }
        completedSessionsToday:
          type: integer
          example: 135
        revenueToday:
          type: object
          properties:
            total: { type: number, example: 4750000 }
            fromSessions: { type: number, example: 3200000 }
            fromBookings: { type: number, example: 1050000 }
            fromSubscriptions: { type: number, example: 500000 }
        bookingsToday:
          type: object
          properties:
            pending: { type: integer, example: 5 }
            confirmed: { type: integer, example: 12 }

    ReportRevenuePeriod:
      type: object
      properties:
        period: { type: string, example: '2025-06' }
        total: { type: number, example: 12500000 }
        session: { type: number, example: 8000000 }
        booking: { type: number, example: 3000000 }
        subscription: { type: number, example: 1500000 }

    ReportRevenueByVehiclePeriod:
      type: object
      properties:
        period: { type: string, example: '2025-06-01' }
        motorcycle: { type: number, example: 3500000 }
        car: { type: number, example: 9000000 }
        total: { type: number, example: 12500000 }

    ReportRevenueComparison:
      type: object
      properties:
        period: { type: string, enum: [week, month, year], example: month }
        current:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            revenue: { type: number, example: 45000000 }
        previous:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            revenue: { type: number, example: 38000000 }
        changePercent:
          type: number
          nullable: true
          example: 18.42

    ReportSessionStats:
      type: object
      properties:
        total: { type: integer, example: 520 }
        byVehicleType:
          type: object
          properties:
            motorcycle: { type: integer, example: 340 }
            car: { type: integer, example: 180 }
        byStatus:
          type: object
          properties:
            active: { type: integer, example: 42 }
            completed: { type: integer, example: 465 }
            cancelled: { type: integer, example: 13 }
        avgDurationMinutes: { type: integer, example: 87 }

    ReportBookingStats:
      type: object
      properties:
        total: { type: integer, example: 80 }
        byStatus:
          type: object
          properties:
            pending: { type: integer, example: 5 }
            confirmed: { type: integer, example: 60 }
            cancelled: { type: integer, example: 10 }
            expired: { type: integer, example: 5 }
        conversionRate: { type: number, example: 75.0, description: '% pending -> confirmed' }
        noShowRate: { type: number, example: 8.33, description: '% confirmed chua check-in' }
        checkedIn: { type: integer, example: 55 }

    ReportSubscriptionStats:
      type: object
      properties:
        activeByPlan:
          type: array
          items:
            type: object
            properties:
              packageId: { type: integer }
              packageName: { type: string, example: 'Goi thang xe may' }
              vehicleType: { type: string, enum: [motorcycle, car] }
              count: { type: integer, example: 45 }
        expiringIn7Days: { type: integer, example: 8 }
        newSubscriptionsDaily:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date, example: '2025-06-01' }
              count: { type: integer, example: 3 }

    ReportOccupancyFloor:
      type: object
      properties:
        floorId: { type: integer, example: 1 }
        floorNumber: { type: integer, example: 1 }
        vehicleType: { type: string, enum: [motorcycle, car] }
        floorType: { type: string, enum: [resident, visitor] }
        occupancyRate: { type: number, example: 72.5, description: 'Phan tram ly so' }

    ReportOccupancyTrendItem:
      type: object
      properties:
        date: { type: string, format: date, example: '2025-06-01' }
        floorId: { type: integer, example: 2 }
        checkIns: { type: integer, example: 38 }

    ReportPeakHourItem:
      type: object
      properties:
        hour: { type: integer, minimum: 0, maximum: 23, example: 8 }
        count: { type: integer, example: 47 }

    ReportPeakDayItem:
      type: object
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7, example: 2, description: '1=Sunday ... 7=Saturday' }
        dayName: { type: string, example: Monday }
        isWeekend: { type: boolean, example: false }
        count: { type: integer, example: 312 }

    ReportTopVehicleItem:
      type: object
      properties:
        rank: { type: integer, example: 1 }
        licensePlate: { type: string, example: '51A-123.45' }
        vehicleType: { type: string, enum: [motorcycle, car] }
        sessionCount: { type: integer, example: 48 }
        totalFee: { type: number, example: 840000 }
        lastSeen: { type: string, format: date-time }

    ReportStaffItem:
      type: object
      properties:
        staffId: { type: integer, example: 3 }
        staffName: { type: string, example: 'Tran Van B' }
        totalSessions: { type: integer, example: 120 }
        completedSessions: { type: integer, example: 115 }
        paidSessions: { type: integer, example: 110 }
        cashCollected: { type: number, example: 2750000 }

    # -- COMMON --
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          oneOf:
            - type: string
              example: Error message
            - type: array
              items:
                type: string
              example: ['fullName is required', 'password must be at least 8 characters']

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 50
        totalPages:
          type: integer
          example: 5

    # -- AUTH --
    Tokens:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    # -- USER --
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: Nguyen Van A
        email:
          type: string
          example: user@example.com
        phone:
          type: string
          example: '0901234567'
          nullable: true
        role:
          type: string
          enum: [admin, manager, staff, user]
          example: user
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedUsers:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # -- VEHICLE --
    Vehicle:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 5
        licensePlate:
          type: string
          example: '30A-12345'
        vehicleType:
          type: string
          enum: [motorcycle, car]
          example: car
        nickname:
          type: string
          nullable: true
          example: Xe di lam
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # -- BUILDING --
    Building:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Toa nha A
        address:
          type: string
          example: 123 Nguyen Hue, Q1, TP.HCM
        description:
          type: string
          nullable: true
          example: Toa nha giu xe 5 tang
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BuildingWithFloors:
      allOf:
        - $ref: '#/components/schemas/Building'
        - type: object
          properties:
            floors:
              type: array
              items:
                $ref: '#/components/schemas/Floor'

    PaginatedBuildings:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Building'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # -- FLOOR --
    Floor:
      type: object
      properties:
        id:
          type: integer
          example: 1
        buildingId:
          type: integer
          example: 1
        floorNumber:
          type: integer
          example: 1
        vehicleType:
          type: string
          enum: [motorcycle, car]
          example: motorcycle
          description: |
            Quyết định loại phương tiện cho toàn bộ tầng.
            - `car` → tầng dùng ParkingSlot (1 ô = 1 xe)
            - `motorcycle` → tầng dùng ParkingRow (1 dãy = N xe)
        floorType:
          type: string
          enum: [resident, visitor]
          example: resident
          description: |
            Phân loại tầng theo đối tượng sử dụng.
            - `resident` → tầng dành cho cư dân (userId bắt buộc khi check-in)
            - `visitor`  → tầng dành cho vãng lai (userId không được có khi check-in)
        totalSlots:
          type: integer
          example: 50
          description: Số ô tối đa (car) hoặc số dãy tối đa (motorcycle)
        description:
          type: string
          nullable: true
          example: Tang danh cho xe may
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FloorDetail:
      allOf:
        - $ref: '#/components/schemas/Floor'
        - type: object
          properties:
            building:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Toa nha A
                address:
                  type: string
                  example: 123 Nguyen Hue, Q1, TP.HCM
            slots:
              type: array
              description: Chỉ có dữ liệu nếu vehicleType = "car"
              items:
                $ref: '#/components/schemas/ParkingSlot'
            rows:
              type: array
              description: Chi co du lieu neu vehicleType = "motorcycle"
              items:
                $ref: '#/components/schemas/ParkingRow'

    PaginatedFloors:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Floor'
              - type: object
                properties:
                  building:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Toa nha A
                      address:
                        type: string
                        example: 123 Nguyen Hue, Q1, TP.HCM
        pagination:
          $ref: '#/components/schemas/Pagination'

    # -- PARKING SLOT (Car only) --
    ParkingSlot:
      type: object
      description: Quan ly o do xe cho xe hoi. Xe may dung ParkingRow.
      properties:
        id:
          type: integer
          example: 1
        floorId:
          type: integer
          example: 2
        slotCode:
          type: string
          example: A01
        vehicleType:
          type: string
          enum: [car]
          example: car
          description: Luon la "car". Xe may dung ParkingRow.
        status:
          type: string
          enum: [empty, occupied, reserved, maintenance]
          example: empty
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ParkingSlotDetail:
      allOf:
        - $ref: '#/components/schemas/ParkingSlot'
        - type: object
          properties:
            floor:
              type: object
              properties:
                id:
                  type: integer
                  example: 2
                floorNumber:
                  type: integer
                  example: 1
                vehicleType:
                  type: string
                  example: car
                buildingId:
                  type: integer
                  example: 1
                building:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Toa nha A
                    address:
                      type: string
                      example: 123 Nguyen Hue, Q1, TP.HCM

    PaginatedParkingSlots:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ParkingSlotDetail'
        pagination:
          $ref: '#/components/schemas/Pagination'

    BulkCreateSlotItem:
      type: object
      required: [slotCode, vehicleType]
      properties:
        slotCode:
          type: string
          minLength: 1
          maxLength: 20
          example: A01
        vehicleType:
          type: string
          enum: [car]
          example: car
          description: Chi chap nhan "car". Xe may dung POST /parking-rows.
        status:
          type: string
          enum: [empty, occupied, reserved, maintenance]
          default: empty
        note:
          type: string
          maxLength: 1000
          nullable: true

    BulkCreateSlotsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            slots:
              type: array
              items:
                $ref: '#/components/schemas/ParkingSlot'
            count:
              type: integer
              example: 3

    # -- PARKING ROW (Motorcycle only) --
    ParkingRow:
      type: object
      description: Quan ly day do xe cho xe may. Mot day chua nhieu xe cung luc.
      properties:
        id:
          type: integer
          example: 1
        floorId:
          type: integer
          example: 3
        rowCode:
          type: string
          example: A
          description: Ma day, duy nhat trong mot tang (vi du A, B, Day 1...)
        capacity:
          type: integer
          example: 30
          description: So xe may toi da co the dau trong day
        occupiedCount:
          type: integer
          example: 20
          description: So xe may dang dau hien tai (cap nhat tu dong khi check-in/out)
        status:
          type: string
          enum: [available, full, maintenance]
          example: available
          description: |
            - `available`: con cho, co the check-in
            - `full`: day, khong the check-in them
            - `maintenance`: dang sua chua, khoa check-in
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ParkingRowDetail:
      allOf:
        - $ref: '#/components/schemas/ParkingRow'
        - type: object
          properties:
            floor:
              type: object
              properties:
                id:
                  type: integer
                  example: 3
                floorNumber:
                  type: integer
                  example: 2
                vehicleType:
                  type: string
                  example: motorcycle
                buildingId:
                  type: integer
                  example: 1
                totalSlots:
                  type: integer
                  example: 5
                building:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Toa nha A
                    address:
                      type: string
                      example: 123 Nguyen Hue, Q1, TP.HCM

    PaginatedParkingRows:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ParkingRowDetail'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # -- PARKING SESSION --
    ParkingSession:
      type: object
      properties:
        id:
          type: integer
          example: 1
        slotId:
          type: integer
          nullable: true
          example: 5
          description: Co gia tri neu vehicleType = "car", null neu xe may
        rowId:
          type: integer
          nullable: true
          example: null
          description: Co gia tri neu vehicleType = "motorcycle", null neu xe hoi
        licensePlate:
          type: string
          example: 51A-12345
        vehicleType:
          type: string
          enum: [motorcycle, car]
          example: car
        entryTime:
          type: string
          format: date-time
        exitTime:
          type: string
          format: date-time
          nullable: true
        fee:
          type: number
          format: float
          example: 0
        status:
          type: string
          enum: [active, completed, cancelled]
          example: active
        note:
          type: string
          nullable: true
        staffId:
          type: integer
          example: 3
        userId:
          type: integer
          nullable: true
          example: 12
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ParkingSessionDetail:
      allOf:
        - $ref: '#/components/schemas/ParkingSession'
        - type: object
          properties:
            slot:
              nullable: true
              description: Co gia tri neu vehicleType = "car"
              type: object
              properties:
                id:
                  type: integer
                  example: 5
                slotCode:
                  type: string
                  example: A01
                floorId:
                  type: integer
                  example: 2
                floor:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 2
                    floorNumber:
                      type: integer
                      example: 1
                    buildingId:
                      type: integer
                      example: 1
                    building:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Toa nha A
                        address:
                          type: string
                          example: 123 Nguyen Hue, Q1, TP.HCM
            row:
              nullable: true
              description: Co gia tri neu vehicleType = "motorcycle"
              type: object
              properties:
                id:
                  type: integer
                  example: 3
                rowCode:
                  type: string
                  example: A
                floorId:
                  type: integer
                  example: 3
                capacity:
                  type: integer
                  example: 30
                occupiedCount:
                  type: integer
                  example: 20
                floor:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 3
                    floorNumber:
                      type: integer
                      example: 2
                    buildingId:
                      type: integer
                      example: 1
                    building:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Toa nha A
                        address:
                          type: string
                          example: 123 Nguyen Hue, Q1, TP.HCM
            staff:
              type: object
              properties:
                id:
                  type: integer
                  example: 3
                fullName:
                  type: string
                  example: Tran Van Staff
            user:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                  example: 12
                fullName:
                  type: string
                  example: Nguyen Van A
                phone:
                  type: string
                  nullable: true
                  example: '0901234567'

    ParkingSessionListItem:
      allOf:
        - $ref: '#/components/schemas/ParkingSession'
        - type: object
          properties:
            slot:
              nullable: true
              description: Co gia tri neu vehicleType = "car"
              type: object
              properties:
                id:
                  type: integer
                  example: 5
                slotCode:
                  type: string
                  example: A01
                floorId:
                  type: integer
                  example: 2
                floor:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 2
                    floorNumber:
                      type: integer
                      example: 1
                    buildingId:
                      type: integer
                      example: 1
                    building:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Toa nha A
            row:
              nullable: true
              description: Co gia tri neu vehicleType = "motorcycle"
              type: object
              properties:
                id:
                  type: integer
                  example: 3
                rowCode:
                  type: string
                  example: A
                floorId:
                  type: integer
                  example: 3
                capacity:
                  type: integer
                  example: 30
                occupiedCount:
                  type: integer
                  example: 20
                floor:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 3
                    floorNumber:
                      type: integer
                      example: 2
                    buildingId:
                      type: integer
                      example: 1
                    building:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Toa nha A
            staff:
              type: object
              properties:
                id:
                  type: integer
                  example: 3
                fullName:
                  type: string
                  example: Tran Van Staff

    PaginatedParkingSessions:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ParkingSessionListItem'
        pagination:
          $ref: '#/components/schemas/Pagination'

    LookupResponse:
      type: object
      properties:
        licensePlate:
          type: string
          example: 51A-12345
        status:
          type: string
          enum: [available, already_active]
          description: |
            `available` — vehicle is not parked, safe to check-in.
            `already_active` — vehicle is currently parked, check-in is blocked.
          example: available
        activeSession:
          nullable: true
          description: Populated only when `status` is `already_active`.
          allOf:
            - $ref: '#/components/schemas/ParkingSessionDetail'
        hint:
          type: object
          description: Pre-fill hints for the check-in form derived from the most recent completed/cancelled session.
          properties:
            linkedResident:
              nullable: true
              description: Resident account linked on the last visit.
              type: object
              properties:
                id:
                  type: integer
                  example: 12
                fullName:
                  type: string
                  example: Nguyen Van A
                phone:
                  type: string
                  nullable: true
                  example: '0901234567'
                email:
                  type: string
                  example: user@example.com
            lastVisit:
              nullable: true
              description: Summary of the most recent completed/cancelled session.
              type: object
              properties:
                vehicleType:
                  type: string
                  enum: [motorcycle, car]
                  example: motorcycle
                entryTime:
                  type: string
                  format: date-time
                exitTime:
                  type: string
                  format: date-time
                  nullable: true
                fee:
                  type: number
                  format: float
                  example: 5000
        availableSlots:
          type: object
          description: |
            So cho trong theo loai xe.
            - car: so o trong (ParkingSlot status=empty)
            - motorcycle: tong so cho trong trong tat ca cac day (sum capacity - occupiedCount)
          properties:
            motorcycle:
              type: integer
              example: 47
            car:
              type: integer
              example: 8

    CheckInCarResponse:
      type: object
      description: Response khi check-in xe hoi
      properties:
        id:
          type: integer
          example: 1
        licensePlate:
          type: string
          example: 51A-12345
        vehicleType:
          type: string
          enum: [car]
          example: car
        entryTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [active]
          example: active
        note:
          type: string
          nullable: true
        slot:
          type: object
          properties:
            id:
              type: integer
              example: 5
            slotCode:
              type: string
              example: A01
            floor:
              type: object
              properties:
                id:
                  type: integer
                  example: 2
                floorNumber:
                  type: integer
                  example: 1
                building:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Toa nha A
        row:
          type: object
          nullable: true
          example: null
        staffId:
          type: integer
          example: 3
        userId:
          type: integer
          nullable: true
          example: 12
        bookingId:
          type: integer
          nullable: true
          description: Co gia tri neu plate co confirmed booking trong khung gio.
          example: 13
        prepaidHours:
          type: integer
          nullable: true
          description: So gio khach da tra truoc qua booking. Dung de tinh excess o check-out.
          example: 4
        prepaidAmount:
          type: number
          nullable: true
          description: So tien khach da tra qua booking (VND).
          example: 80000
        paymentStatus:
          type: string
          enum: [paid, unpaid]
          description: |
            `paid` neu booking da tra du, hoac resident co sub.
            `unpaid` neu walk-in pure (thu phi luc exit).

    CheckInMotorcycleResponse:
      type: object
      description: Response khi check-in xe may
      properties:
        id:
          type: integer
          example: 2
        licensePlate:
          type: string
          example: 59B-67890
        vehicleType:
          type: string
          enum: [motorcycle]
          example: motorcycle
        entryTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [active]
          example: active
        note:
          type: string
          nullable: true
        slot:
          type: object
          nullable: true
          example: null
        row:
          type: object
          properties:
            id:
              type: integer
              example: 3
            rowCode:
              type: string
              example: A
            capacity:
              type: integer
              example: 30
            occupiedCount:
              type: integer
              example: 21
              description: So xe sau khi check-in (da tang 1)
            floor:
              type: object
              properties:
                id:
                  type: integer
                  example: 3
                floorNumber:
                  type: integer
                  example: 2
                building:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Toa nha A
        staffId:
          type: integer
          example: 3
        userId:
          type: integer
          nullable: true
          example: null

# -- PATHS --
paths:

  # -- AUTH --
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      description: |
        Tạo tài khoản mới với role `user` mặc định.
        Sau khi đăng ký, một email xác minh sẽ được gửi đến địa chỉ email đã cung cấp.
        Tài khoản chỉ có thể đăng nhập sau khi xác minh email thành công qua `GET /auth/verify-email`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password]
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Nguyen Van A
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  example: Password1
                phone:
                  type: string
                  pattern: '^[0-9]{9,11}$'
                  example: '0901234567'
      responses:
        '201':
          description: Đăng ký thành công, email xác minh đã được gửi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Đăng ký thành công. Vui lòng kiểm tra email để xác minh tài khoản.
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Quá nhiều lần đăng ký (10 lần/giờ)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: Password1
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Tokens'
        '401':
          description: Sai email hoặc mật khẩu, hoặc tài khoản bị vô hiệu hóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email chưa được xác minh
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Vui lòng xác minh email trước khi đăng nhập. Kiểm tra hộp thư của bạn.
        '429':
          description: Quá nhiều lần đăng nhập sai (15 lần/15 phút)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Tokens'
        '401':
          description: Invalid or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change current user password
      description: Changes the authenticated user's password after verifying the current password. Returns fresh access and refresh tokens.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              properties:
                currentPassword:
                  type: string
                  example: Password1
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 128
                  example: NewPassword1
                confirmPassword:
                  type: string
                  description: Must match newPassword
                  example: NewPassword1
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Tokens'
        '400':
          description: Validation error, incorrect current password, or new password matches current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Xác minh email
      description: |
        Xác minh địa chỉ email của tài khoản bằng token nhận được qua email.
        Token có hiệu lực trong **24 giờ** kể từ thời điểm đăng ký hoặc gửi lại.
        Sau khi xác minh thành công, tài khoản có thể đăng nhập bình thường.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            example: a3f2c1d4e5b6a7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2
          description: Token 64 ký tự hex nhận được qua email xác minh
      responses:
        '200':
          description: Xác minh email thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Xác minh email thành công. Bạn có thể đăng nhập ngay bây giờ.
        '400':
          description: Token không hợp lệ, đã sử dụng, hoặc đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Token không hợp lệ
                  value: { success: false, message: Token không hợp lệ hoặc đã được sử dụng }
                expired:
                  summary: Token hết hạn
                  value: { success: false, message: Token đã hết hạn. Vui lòng yêu cầu gửi lại email xác minh. }
                alreadyVerified:
                  summary: Email đã được xác minh
                  value: { success: false, message: Email đã được xác minh trước đó }

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Gửi lại email xác minh
      description: |
        Gửi lại email xác minh cho tài khoản chưa được xác minh.
        Token cũ sẽ bị thay thế bằng token mới, có hiệu lực trong 24 giờ.
        Để tránh lộ thông tin tài khoản, response luôn trả về thông báo chung dù email có tồn tại hay không.
        Rate limit: **5 lần/giờ** mỗi IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Đã xử lý yêu cầu (thông báo chung để tránh lộ thông tin tài khoản)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Nếu email tồn tại và chưa xác minh, chúng tôi đã gửi lại email xác minh.
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Quá nhiều yêu cầu (5 lần/giờ)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

