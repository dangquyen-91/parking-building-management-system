                        status: active
                        slot: null
                        row:
                          id: 3
                          rowCode: A
                          capacity: 30
                          occupiedCount: 21
                          floor:
                            id: 3
                            floorNumber: 2
                            buildingId: 1
                            building:
                              id: 1
                              name: Toa nha A
                        staff:
                          id: 3
                          fullName: Tran Van Staff
                        user: null
                      hint:
                        linkedResident: null
                        lastVisit: null
                      availableSlots:
                        motorcycle: 46
                        car: 8
        '400':
          description: Missing or invalid licensePlate query param
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /parking-sessions/{id}:
    get:
      tags: [Parking Sessions]
      summary: Get parking session by ID (admin, manager, staff)
      description: |
        Tra ve chi tiet session. Truong `slot` hoac `row` se co gia tri tuy vehicleType, cai con lai la null.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Chi tiet session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ParkingSessionDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /parking-sessions/{id}/checkout-preview:
    get:
      tags: [Parking Sessions]
      summary: Preview check-out fee (admin, manager, staff)
      description: |
        Bao gia phi truoc khi check-out — KHONG dong session. Staff dung de bao
        khach so tien, thu tien mat, roi moi xac nhan POST /check-out.
        - Cu dan co goi active (tang resident) → fee 0 (`paymentMethod: package`)
        - Vang lai → phi flat theo loai xe (`paymentMethod: cash`)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Fee quote
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessionId: { type: integer }
                          licensePlate: { type: string }
                          vehicleType: { type: string, enum: [motorcycle, car] }
                          entryTime: { type: string, format: date-time }
                          now: { type: string, format: date-time }
                          durationMinutes: { type: integer }
                          floorType: { type: string, enum: [resident, visitor], nullable: true }
                          covered: { type: boolean }
                          coveredBy: { type: string, nullable: true, example: subscription }
                          fee: { type: integer, example: 5000 }
                          paymentMethod: { type: string, enum: [cash, package] }
        '404': { description: Session not found }
        '409': { description: Session is not active }

  /parking-sessions/{id}/check-out:
    post:
      tags: [Parking Sessions]
      summary: Vehicle check-out — cash or VNPay (admin, manager, staff)
      description: |
        Hoan tat xe ra. Body chon hinh thuc thanh toan:
          - `paymentMethod: 'cash'`  → dong session ngay, tao Payment audit (cash).
          - `paymentMethod: 'vnpay'` → tao Payment pending + tra paymentUrl; session VAN active, doi IPN/queryDr.

        **Pricing (spec A):**
          - Xe may: 5.000/luot (qua 24h → cong luot), +5.000/dem (cham 22:00-06:00)
          - O to:   20.000/h (round up), cap 120.000/24h, +30.000/dem
          - Cu dan co goi (sub active match plate + floor=resident) → fee=0 ("covered")
          - Booking (session co prepaidHours): chi tinh phan vuot gio bang pricing A

        **Giai phong cho khi session dong (cash hoac VNPay success):**
          - O to vang lai → slot ve `empty`; o to cu dan (slot reserved con han) → giu `reserved`
          - Xe may → row.occupiedCount giam 1
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentMethod:
                  type: string
                  enum: [cash, vnpay]
                  default: cash
                  description: Hinh thuc thanh toan. Mac dinh 'cash' neu khong truyen.
      responses:
        '200':
          description: |
            Check-out xu ly xong. Hai shape:
              - `cash`: session da dong, fee = so tien thu, paymentId co gia tri.
              - `vnpay`: session VAN active (cho IPN), paymentUrl + orderId tra ve cho FE.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessionId: { type: integer }
                          licensePlate: { type: string }
                          vehicleType: { type: string }
                          entryTime: { type: string, format: date-time }
                          exitTime: { type: string, format: date-time, nullable: true }
                          durationMinutes: { type: integer, nullable: true }
                          fee: { type: integer }
                          covered: { type: boolean }
                          coveredBy: { type: string, nullable: true }
                          paymentMethod: { type: string, enum: [cash, vnpay, package] }
                          paymentId: { type: integer, nullable: true, description: 'Chi co o cash' }
                          paymentUrl: { type: string, nullable: true, description: 'Chi co o vnpay (fee>0)' }
                          orderId: { type: string, nullable: true, description: 'Chi co o vnpay' }
                          breakdown:
                            type: object
                            description: Chi tiet pricing (baseFee, overnightFee, mode, overnightNights, ...)
        '400': { description: 'Invalid paymentMethod (must be cash or vnpay)' }
        '404': { description: Session not found }
        '409': { description: Session is not active (already checked out?) }

  /parking-sessions/check-in:
    post:
      tags: [Parking Sessions]
      summary: Vehicle check-in (admin, manager, staff)
      description: |
        Tao parking session va cap nhat trang thai o/day.
        Chay trong database transaction voi row-level lock (tranh race condition).

        **Phan nhanh theo vehicleType:**
        - `car` → phai co `slotId`, `rowId` bi cam (forbidden)
        - `motorcycle` → phai co `rowId`, `slotId` bi cam (forbidden)

        **Validations chung:**
        - Bien so chua co active session
        - userId (neu co) phai ton tai

        **Validations xe hoi:**
        - Slot phai ton tai va `status = "empty"`
        - Tang va toa nha phai active
        - floor.vehicleType phai la "car"

        **Validations xe may:**
        - Row phai ton tai va `status != "maintenance"`
        - `occupiedCount < capacity`
        - Tang va toa nha phai active
        - floor.vehicleType phai la "motorcycle"

        **Validations floorType (cư dân / vãng lai):**
        - Tầng `resident` → `userId` **bắt buộc** (lỗi 403 nếu không có)
        - Tầng `visitor`  → `userId` **không được có** (lỗi 403 nếu truyền lên)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Check-in xe hoi
                  type: object
                  required: [vehicleType, licensePlate, slotId]
                  properties:
                    vehicleType:
                      type: string
                      enum: [car]
                      example: car
                    licensePlate:
                      type: string
                      minLength: 4
                      maxLength: 20
                      example: 51A-12345
                      description: Chi chu cai, chu so va go ngang. Tu dong uppercase.
                    slotId:
                      type: integer
                      example: 5
                      description: ID o do xe (phai status = empty)
                    userId:
                      type: integer
                      nullable: true
                      example: 12
                    note:
                      type: string
                      maxLength: 500
                      nullable: true
                - title: Check-in xe may
                  type: object
                  required: [vehicleType, licensePlate, rowId]
                  properties:
                    vehicleType:
                      type: string
                      enum: [motorcycle]
                      example: motorcycle
                    licensePlate:
                      type: string
                      minLength: 4
                      maxLength: 20
                      example: 59B-67890
                    rowId:
                      type: integer
                      example: 3
                      description: ID day do xe (phai status != maintenance va chua day)
                    userId:
                      type: integer
                      nullable: true
                      example: null
                    note:
                      type: string
                      maxLength: 500
                      nullable: true
            examples:
              checkInCarResident:
                summary: Check-in xe hơi - tầng cư dân (userId bắt buộc)
                value:
                  vehicleType: car
                  licensePlate: 51A-12345
                  slotId: 5
                  userId: 12
              checkInCarVisitor:
                summary: Check-in xe hơi - tầng vãng lai (không có userId)
                value:
                  vehicleType: car
                  licensePlate: 51B-99999
                  slotId: 20
              checkInMotorcycleResident:
                summary: Check-in xe máy - tầng cư dân (userId bắt buộc)
                value:
                  vehicleType: motorcycle
                  licensePlate: 59B-67890
                  rowId: 3
                  userId: 7
              checkInMotorcycleVisitor:
                summary: Check-in xe máy - tầng vãng lai (không có userId)
                value:
                  vehicleType: motorcycle
                  licensePlate: 60C-11111
                  rowId: 8
      responses:
        '201':
          description: Check-in thanh cong
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/CheckInCarResponse'
                          - $ref: '#/components/schemas/CheckInMotorcycleResponse'
              examples:
                carCheckIn:
                  summary: Response xe hoi (co slot, row = null)
                  value:
                    success: true
                    data:
                      id: 1
                      licensePlate: 51A-12345
                      vehicleType: car
                      entryTime: '2024-05-20T07:15:00.000Z'
                      status: active
                      note: null
                      slot:
                        id: 5
                        slotCode: A01
                        floor:
                          id: 2
                          floorNumber: 1
                          building:
                            id: 1
                            name: Toa nha A
                      row: null
                      staffId: 3
                      userId: 12
                motorcycleCheckIn:
                  summary: Response xe may (slot = null, co row)
                  value:
                    success: true
                    data:
                      id: 2
                      licensePlate: 59B-67890
                      vehicleType: motorcycle
                      entryTime: '2024-05-20T08:00:00.000Z'
                      status: active
                      note: null
                      slot: null
                      row:
                        id: 3
                        rowCode: A
                        capacity: 30
                        occupiedCount: 21
                        floor:
                          id: 3
                          floorNumber: 2
                          building:
                            id: 1
                            name: Toa nha A
                      staffId: 3
                      userId: null
        '400':
          description: |
            - Validation error (slotId/rowId khong khop vehicleType)
            - vehicleType mismatch voi floor
            - Floor hoac building inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                slotIdForbidden:
                  summary: Gui slotId cho xe may
                  value:
                    success: false
                    message: ['"slotId" is not allowed']
                rowIdForbidden:
                  summary: Gui rowId cho xe hoi
                  value:
                    success: false
                    message: ['"rowId" is not allowed']
                floorTypeMismatch:
                  summary: Check-in car vao motorcycle floor
                  value:
                    success: false
                    message: This slot only accepts car
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            - Access denied (không đủ quyền)
            - Tầng resident nhưng không có userId
            - Tầng visitor nhưng có userId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                residentRequiresUserId:
                  summary: Tầng cư dân nhưng thiếu userId
                  value:
                    success: false
                    message: This floor is for residents only. userId is required.
                visitorForbidsUserId:
                  summary: Tầng vãng lai nhưng có userId
                  value:
                    success: false
                    message: This floor is for visitors only. Do not provide userId.
        '404':
          description: Slot, row hoac user khong tim thay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            - Slot dang occupied/reserved/maintenance
            - Row dang full hoac maintenance
            - Bien so da co active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                slotNotEmpty:
                  summary: O xe khong trong
                  value:
                    success: false
                    message: 'Slot is not available (current status: occupied)'
                rowFull:
                  summary: Day xe may da day
                  value:
                    success: false
                    message: 'Row is full (30/30)'
                alreadyCheckedIn:
                  summary: Bien so da check-in
                  value:
                    success: false
                    message: 'License plate 51A-12345 is already checked in (session #42)'

  # ── PACKAGES (resident parking plans) ─────────────────
  /packages:
    get:
      tags: [Packages]
      summary: List parking packages
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleType
          in: query
          schema: { type: string, enum: [motorcycle, car] }
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: List of packages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    post:
      tags: [Packages]
      summary: Create a package (admin, manager)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, vehicleType, durationDays, price]
              properties:
                name: { type: string, example: Xe máy hàng tháng }
                vehicleType: { type: string, enum: [motorcycle, car], example: motorcycle }
                durationDays: { type: integer, example: 30 }
                price: { type: integer, example: 150000 }
                description: { type: string, example: Gửi xe máy 1 tháng }
                isActive: { type: boolean, default: true }
      responses:
        '201':
          description: Package created

  /packages/{id}:
    get:
      tags: [Packages]
      summary: Get a package by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Package found }
        '404': { description: Package not found }
    patch:
      tags: [Packages]
      summary: Update a package (admin, manager)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                vehicleType: { type: string, enum: [motorcycle, car] }
                durationDays: { type: integer }
                price: { type: integer }
                description: { type: string }
                isActive: { type: boolean }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Packages]
      summary: Disable a package (admin, manager) — soft delete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Package disabled }

  # ── SUBSCRIPTIONS (resident buys a package) ───────────
  /subscriptions:
    get:
      tags: [Subscriptions]
      summary: List all subscriptions (admin, manager, staff)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, active, expired, cancelled] }
        - name: licensePlate
          in: query
          schema: { type: string }
      responses:
        '200': { description: List of subscriptions }
    post:
      tags: [Subscriptions]
      summary: Buy a package for a license plate (returns VNPay URL)
      description: |
        Creates a pending subscription + pending payment, returns a VNPay URL.
        The subscription is activated only after the VNPay IPN confirms success.
        Residents buy for themselves; staff/manager/admin may pass `userId` to buy on behalf.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageId, licensePlate]
              properties:
                packageId: { type: integer, example: 1 }
                licensePlate: { type: string, example: 51A-12345 }
                slotId:
                  type: integer
                  description: 'Required for CAR packages (fixed reserved slot on a resident floor). Ignored for motorcycle.'
                  example: 5
                userId: { type: integer, description: 'Privileged roles only — buy on behalf of a resident' }
      responses:
        '201':
          description: Subscription created, payment pending
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          paymentUrl: { type: string }
                          orderId: { type: string }
                          subscriptionId: { type: integer }
                          slotId: { type: integer, nullable: true }
                          amount: { type: integer }
        '400': { description: 'slotId required for car / slot not a car slot / not a resident floor' }
        '404': { description: Package not found or inactive / slot not found }
        '409': { description: Pending purchase already exists, or slot is not available }

  /subscriptions/expire:
    post:
      tags: [Subscriptions]
      summary: Sweep expired/stale subscriptions, free reserved slots (admin, manager)
      description: |
        Cancels pending subscriptions older than 15 minutes and marks active
        subscriptions past their endDate as expired, releasing reserved car slots.
        Intended to be run on a schedule (no cron wired yet).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sweep result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          pendingCancelled: { type: integer }
                          activeExpired: { type: integer }

  /subscriptions/me:
    get:
      tags: [Subscriptions]
      summary: List my subscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, active, expired, cancelled] }
      responses:
        '200': { description: My subscriptions }

  /subscriptions/active:
    get:
      tags: [Subscriptions]
      summary: Check active subscription for a license plate (admin, manager, staff)
      description: Used by the check-out flow to decide whether a resident vehicle is covered.
      security:
        - bearerAuth: []
      parameters:
        - name: licensePlate
          in: query
          required: true
          schema: { type: string, example: 51A-12345 }
      responses:
        '200':
          description: Active subscription or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          active: { type: boolean }
                          subscription: { type: object, nullable: true }

  /subscriptions/{id}:
    get:
      tags: [Subscriptions]
      summary: Get a subscription by id (owner or privileged)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Subscription found }
        '403': { description: Access denied }
        '404': { description: Subscription not found }

  # ── PAYMENTS (VNPay callbacks) ────────────────────────
  /payments/vnpay/return:
    get:
      tags: [Payments]
      summary: VNPay browser return URL (public)
      description: |
        VNPay redirects browser here after checkout. Verifies signature then
        302-redirects to FRONTEND_PAYMENT_RETURN_URL with status query params.
        Does NOT mutate business state (rely on IPN).
      responses:
        '302':
          description: Redirect to frontend with `?status=success|failed&code=<code>&orderId=<id>`

  /payments/vnpay/ipn:
    get:
      tags: [Payments]
      summary: VNPay server-to-server IPN (public)
      description: |
        Called by VNPay backend. Authoritative source for marking payment success/failure.
        Returns VNPay-standard RspCode JSON (NOT the API envelope).
      responses:
        '200':
          description: IPN processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  RspCode:
                    type: string
                    enum: ['00', '01', '02', '04', '97']
                  Message:
                    type: string

  /payments/{orderId}/query:
    get:
      tags: [Payments]
      summary: Reconcile a payment via VNPay queryDr (staff, manager, admin)
      description: |
        Actively asks VNPay for the true status of this order (queryDr) and
        updates the payment + subscription if VNPay reports success while our
        record is still pending. Works WITHOUT IPN/ngrok — use it on localhost
        or for manual reconciliation when an IPN was missed.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reconciliation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderId: { type: string }
                          paid: { type: boolean }
                          queryResponseCode: { type: string }
                          transactionStatus: { type: string, nullable: true }
                          message: { type: string }
                          paymentStatus: { type: string, example: success }
                          subscriptionStatus: { type: string, nullable: true, example: active }
                          amount: { type: integer }
        '400': { description: Original transaction date not recorded for this order }
        '404': { description: Payment not found }

  /payments/{orderId}:
    get:
      tags: [Payments]
      summary: Get payment status by orderId
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Payment not found
