  # ── PARKING SESSIONS ──────────────────────────────────
  /parking-sessions:
    get:
      tags: [Parking Sessions]
      summary: Get active parking sessions (admin, manager, staff)
      description: |
        Trả về danh sách các session đang **active** (xe đang gửi).
        Hỗ trợ lọc theo tầng, tòa nhà, loại xe và tìm kiếm biển số.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/queryPage'
        - $ref: '#/components/parameters/queryLimit'
        - name: floorId
          in: query
          schema:
            type: integer
          description: Lọc theo tầng
        - name: buildingId
          in: query
          schema:
            type: integer
          description: Lọc theo tòa nhà
        - name: vehicleType
          in: query
          schema:
            type: string
            enum: [motorcycle, car]
          description: Lọc theo loại xe
        - name: search
          in: query
          schema:
            type: string
          description: Tìm kiếm theo biển số xe (LIKE)
          example: 51A
      responses:
        '200':
          description: Danh sách session đang active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedParkingSessions'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /parking-sessions/lookup:
    get:
      tags: [Parking Sessions]
      summary: Lookup license plate before check-in (admin, manager, staff)
      description: |
        **Preview endpoint** — call this before `POST /check-in` so staff can confirm:
        - Is the vehicle already parked? (`already_active` → block the confirm button)
        - Which resident was linked on their last visit? (`hint.linkedResident` → pre-fill the userId field)
        - How many empty slots are available right now? (`availableSlots`)

        No side effects — read-only, never cached.
      security:
        - bearerAuth: []
      parameters:
        - name: licensePlate
          in: query
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 20
            example: 51A-12345
          description: Letters, numbers and hyphens only. Automatically uppercased before lookup.
      responses:
        '200':
          description: Lookup result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LookupResponse'
              examples:
                available:
                  summary: Vehicle not currently parked — safe to check in
                  value:
                    success: true
                    data:
                      licensePlate: 51A-12345
                      status: available
                      activeSession: null
                      hint:
                        linkedResident:
                          id: 12
                          fullName: Nguyen Van A
                          phone: '0901234567'
                          email: user@example.com
                        lastVisit:
                          vehicleType: motorcycle
                          entryTime: '2024-05-01T08:00:00.000Z'
                          exitTime: '2024-05-01T17:30:00.000Z'
                          fee: 5000
                      availableSlots:
                        motorcycle: 24
                        car: 8
                alreadyActive:
                  summary: Vehicle is currently parked — check-in blocked
                  value:
                    success: true
                    data:
                      licensePlate: 51A-12345
                      status: already_active
                      activeSession:
                        id: 42
                        licensePlate: 51A-12345
                        vehicleType: motorcycle
                        entryTime: '2024-05-20T07:15:00.000Z'
                        exitTime: null
                        fee: 0
                        status: active
                        note: null
                        slotId: 5
                        staffId: 3
                        userId: null
                        slot:
                          id: 5
                          slotCode: A01
                          floorId: 2
                          floor:
                            id: 2
                            floorNumber: 1
                            buildingId: 1
                            building:
                              id: 1
                              name: Toa nha A
                              address: 123 Nguyen Hue, Q1, TP.HCM
                        staff:
                          id: 3
                          fullName: Tran Van Staff
                        user: null
                      hint:
                        linkedResident: null
                        lastVisit: null
                      availableSlots:
                        motorcycle: 23
                        car: 8
                newVehicle:
                  summary: First-time vehicle — no resident hint
                  value:
                    success: true
                    data:
                      licensePlate: 59B1-99999
                      status: available
                      activeSession: null
                      hint:
                        linkedResident: null
                        lastVisit: null
                      availableSlots:
                        motorcycle: 24
                        car: 8
        '400':
          description: Missing or invalid `licensePlate` query param
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: ['"licensePlate" is required']
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /parking-sessions/{id}:
    get:
      tags: [Parking Sessions]
      summary: Get parking session by ID (admin, manager, staff)
      description: |
        Trả về chi tiết một session kèm thông tin slot, tầng, tòa nhà, staff thực hiện check-in và khách hàng (nếu có).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Chi tiết session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ParkingSessionDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /parking-sessions/check-in:
    post:
      tags: [Parking Sessions]
      summary: Vehicle check-in (admin, manager, staff)
      description: |
        Creates an active parking session and marks the slot as `occupied`.
        Runs inside a database transaction with row-level lock to prevent race conditions.

        **Validations:**
        - Slot must exist and be `empty`
        - Floor and building must be active
        - `vehicleType` must match the floor's vehicleType
        - License plate must not already have an active session
        - `userId` (if provided) must exist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId, licensePlate, vehicleType]
              properties:
                slotId:
                  type: integer
                  example: 5
                licensePlate:
                  type: string
                  minLength: 4
                  maxLength: 20
                  example: 51A-12345
                  description: Letters, numbers and hyphens only — automatically uppercased
                vehicleType:
                  type: string
                  enum: [motorcycle, car]
                  example: motorcycle
                userId:
                  type: integer
                  nullable: true
                  example: 12
                  description: Optional — link session to a registered customer
                note:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '201':
          description: Check-in successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CheckInResponse'
        '400':
          description: Validation error, vehicleType mismatch, or inactive floor/building
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Slot or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slot not available or license plate already checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
