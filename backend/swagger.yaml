  # -- PARKING ROWS (Motorcycle floors only) --
  /parking-rows:
    get:
      tags: [Parking Rows]
      summary: Get all parking rows
      description: Danh sach cac day do xe may. Tuong duong GET /parking-slots nhung danh cho xe may.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/queryPage'
        - $ref: '#/components/parameters/queryLimit'
        - name: floorId
          in: query
          schema:
            type: integer
          description: Filter theo tang
        - name: buildingId
          in: query
          schema:
            type: integer
          description: Filter theo toa nha (via floor join)
        - name: status
          in: query
          schema:
            type: string
            enum: [available, full, maintenance]
          description: Filter theo trang thai day
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [rowCode, capacity, occupiedCount, status, createdAt]
            default: rowCode
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
      responses:
        '200':
          description: Paginated list of parking rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedParkingRows'
        '400':
          description: Invalid filter value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Parking Rows]
      summary: Create a new parking row (admin, manager) — motorcycle floors only
      description: |
        Chi tao duoc tren tang xe may (floor.vehicleType = "motorcycle").
        Tang xe hoi dung POST /parking-slots.
        Tong capacity cua tat ca cac day (bao gom day moi) khong duoc vuot qua floor.totalSlots.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [floorId, rowCode, capacity]
              properties:
                floorId:
                  type: integer
                  example: 3
                  description: ID tang xe may
                rowCode:
                  type: string
                  minLength: 1
                  maxLength: 20
                  example: A
                  description: Ma day, duy nhat trong tang (A, B, Day 1...)
                capacity:
                  type: integer
                  minimum: 1
                  maximum: 500
                  example: 30
                  description: So xe may toi da trong day
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
            examples:
              createRowA:
                summary: Tao day A suc chua 30 xe
                value:
                  floorId: 3
                  rowCode: A
                  capacity: 30
              createRowB:
                summary: Tao day B suc chua 25 xe
                value:
                  floorId: 3
                  rowCode: B
                  capacity: 25
                  note: Gan loi ra
      responses:
        '201':
          description: Row created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ParkingRow'
        '400':
          description: |
            - Validation error
            - floor.vehicleType != "motorcycle"
            - Floor or building inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongFloorType:
                  summary: Tang la xe hoi, khong phai xe may
                  value:
                    success: false
                    message: Parking rows can only be created on motorcycle floors
                floorInactive:
                  summary: Tang dang inactive
                  value:
                    success: false
                    message: Floor is inactive
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Floor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            - rowCode da ton tai tren tang nay
            - Tong capacity cua cac day vuot qua floor.totalSlots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rowCodeConflict:
                  summary: Ma day da ton tai
                  value:
                    success: false
                    message: 'Row code "A" already exists on this floor'
                capacityExceeded:
                  summary: Tong capacity vuot qua gioi han tang
                  value:
                    success: false
                    message: 'Floor capacity exceeded. Used: 80, adding: 30, max: 100'

  /parking-rows/{id}:
    get:
      tags: [Parking Rows]
      summary: Get parking row by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
