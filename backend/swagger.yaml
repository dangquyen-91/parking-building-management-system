openapi: 3.0.3
info:
  title: Parking Building Management API
  description: API for managing parking building operations
  version: 1.0.0

servers:
  - url: http://localhost:5000/api/v1
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        example: 1
    queryPage:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    queryLimit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
    queryIsActive:
      name: isActive
      in: query
      schema:
        type: boolean
    querySortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [ASC, DESC]
        default: DESC

  schemas:
    # ── COMMON ──────────────────────────────────────────
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          oneOf:
            - type: string
              example: Error message
            - type: array
              items:
                type: string
              example: ['fullName is required', 'password must be at least 8 characters']

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 50
        totalPages:
          type: integer
          example: 5

    # ── AUTH ────────────────────────────────────────────
    Tokens:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    # ── USER ────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: Nguyen Van A
        email:
          type: string
          example: user@example.com
        phone:
          type: string
          example: '0901234567'
          nullable: true
        role:
          type: string
          enum: [admin, manager, staff, user]
          example: user
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedUsers:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ── BUILDING ────────────────────────────────────────
    Building:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Toa nha A
        address:
          type: string
          example: 123 Nguyen Hue, Q1, TP.HCM
        description:
          type: string
          nullable: true
          example: Toa nha giu xe 5 tang
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BuildingWithFloors:
      allOf:
        - $ref: '#/components/schemas/Building'
        - type: object
          properties:
            floors:
              type: array
              items:
                $ref: '#/components/schemas/Floor'

    PaginatedBuildings:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Building'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ── FLOOR ───────────────────────────────────────────
    Floor:
      type: object
      properties:
        id:
          type: integer
          example: 1
        buildingId:
          type: integer
          example: 1
        floorNumber:
          type: integer
          example: 1
        vehicleType:
          type: string
          enum: [motorcycle, car]
          example: motorcycle
        totalSlots:
          type: integer
          example: 50
        description:
          type: string
          nullable: true
          example: Tang danh cho xe may
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FloorDetail:
      allOf:
        - $ref: '#/components/schemas/Floor'
        - type: object
          properties:
            building:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Toa nha A
                address:
                  type: string
                  example: 123 Nguyen Hue, Q1, TP.HCM
            slots:
              type: array
              items:
                $ref: '#/components/schemas/ParkingSlot'

    PaginatedFloors:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Floor'
              - type: object
                properties:
                  building:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Toa nha A
                      address:
                        type: string
                        example: 123 Nguyen Hue, Q1, TP.HCM
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ── PARKING SLOT ────────────────────────────────────
    ParkingSlot:
      type: object
      properties:
        id:
          type: integer
          example: 1
        floorId:
          type: integer
          example: 2
        slotCode:
          type: string
          example: A01
        vehicleType:
          type: string
          enum: [motorcycle, car]
          example: motorcycle
        status:
          type: string
          enum: [empty, occupied, reserved, maintenance]
          example: empty
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ParkingSlotDetail:
      allOf:
        - $ref: '#/components/schemas/ParkingSlot'
        - type: object
          properties:
            floor:
              type: object
              properties:
                id:
                  type: integer
                  example: 2
                floorNumber:
                  type: integer
                  example: 1
                vehicleType:
                  type: string
                  example: motorcycle
                buildingId:
                  type: integer
                  example: 1
                building:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Toa nha A
                    address:
                      type: string
                      example: 123 Nguyen Hue, Q1, TP.HCM

    PaginatedParkingSlots:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ParkingSlotDetail'
        pagination:
          $ref: '#/components/schemas/Pagination'

    BulkCreateSlotItem:
      type: object
      required: [slotCode, vehicleType]
      properties:
        slotCode:
          type: string
          minLength: 1
          maxLength: 20
          example: A01
        vehicleType:
          type: string
          enum: [motorcycle, car]
          example: motorcycle
        status:
          type: string
          enum: [empty, occupied, reserved, maintenance]
          default: empty
        note:
          type: string
          maxLength: 1000
          nullable: true

    BulkCreateSlotsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            slots:
              type: array
              items:
                $ref: '#/components/schemas/ParkingSlot'
            count:
              type: integer
              example: 3

    # ── PARKING SESSION ─────────────────────────────────
    ParkingSession:
      type: object
      properties:
        id:
          type: integer
          example: 1
        slotId:
          type: integer
          example: 5
        licensePlate:
          type: string
          example: 51A-12345
        vehicleType:
          type: string
          enum: [motorcycle, car]
          example: motorcycle
        entryTime:
          type: string
          format: date-time
        exitTime:
          type: string
          format: date-time
          nullable: true
        fee:
          type: number
          format: float
          example: 0
        status:
          type: string
          enum: [active, completed, cancelled]
          example: active
        note:
          type: string
          nullable: true
        staffId:
          type: integer
          example: 3
        userId:
          type: integer
          nullable: true
          example: 12
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ParkingSessionDetail:
      allOf:
        - $ref: '#/components/schemas/ParkingSession'
        - type: object
          properties:
            slot:
              type: object
              properties:
                id:
                  type: integer
                  example: 5
                slotCode:
                  type: string
                  example: A01
                floorId:
                  type: integer
                  example: 2
                floor:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 2
                    floorNumber:
                      type: integer
                      example: 1
                    buildingId:
                      type: integer
                      example: 1
                    building:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Toa nha A
                        address:
                          type: string
                          example: 123 Nguyen Hue, Q1, TP.HCM
            staff:
              type: object
              properties:
                id:
                  type: integer
                  example: 3
                fullName:
                  type: string
                  example: Tran Van Staff
            user:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                  example: 12
                fullName:
                  type: string
                  example: Nguyen Van A
                phone:
                  type: string
                  nullable: true
                  example: '0901234567'

    ParkingSessionListItem:
      allOf:
        - $ref: '#/components/schemas/ParkingSession'
        - type: object
          properties:
            slot:
              type: object
              properties:
                id:
                  type: integer
                  example: 5
                slotCode:
                  type: string
                  example: A01
                floorId:
                  type: integer
                  example: 2
                floor:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 2
                    floorNumber:
                      type: integer
                      example: 1
                    buildingId:
                      type: integer
                      example: 1
                    building:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Toa nha A
            staff:
              type: object
              properties:
                id:
                  type: integer
                  example: 3
                fullName:
                  type: string
                  example: Tran Van Staff

    PaginatedParkingSessions:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ParkingSessionListItem'
        pagination:
          $ref: '#/components/schemas/Pagination'

    LookupResponse:
      type: object
      properties:
        licensePlate:
          type: string
          example: 51A-12345
        status:
          type: string
          enum: [available, already_active]
          description: |
            `available` — vehicle is not parked, safe to check-in.
            `already_active` — vehicle is currently parked, check-in is blocked.
          example: available
        activeSession:
          nullable: true
          description: Populated only when `status` is `already_active`.
          allOf:
            - $ref: '#/components/schemas/ParkingSessionDetail'
        hint:
          type: object
          description: Pre-fill hints for the check-in form derived from the most recent completed/cancelled session.
          properties:
            linkedResident:
              nullable: true
              description: Resident account linked on the last visit — use as the default `userId` on the check-in form.
              type: object
              properties:
                id:
                  type: integer
                  example: 12
                fullName:
                  type: string
                  example: Nguyen Van A
                phone:
                  type: string
                  nullable: true
                  example: '0901234567'
                email:
                  type: string
                  example: user@example.com
            lastVisit:
              nullable: true
              description: Summary of the most recent completed/cancelled session.
              type: object
              properties:
                vehicleType:
                  type: string
                  enum: [motorcycle, car]
                  example: motorcycle
                entryTime:
                  type: string
                  format: date-time
                exitTime:
                  type: string
                  format: date-time
                  nullable: true
                fee:
                  type: number
                  format: float
                  example: 5000
        availableSlots:
          type: object
          description: Real-time count of `empty` slots per vehicleType across all floors.
          properties:
            motorcycle:
              type: integer
              example: 24
            car:
              type: integer
              example: 8

    CheckInResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        licensePlate:
          type: string
          example: 51A-12345
        vehicleType:
          type: string
          enum: [motorcycle, car]
          example: motorcycle
        entryTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [active]
          example: active
        note:
          type: string
          nullable: true
        slot:
          type: object
          properties:
            id:
              type: integer
              example: 5
            slotCode:
              type: string
              example: A01
            floor:
              type: object
              properties:
                id:
                  type: integer
                  example: 2
                floorNumber:
                  type: integer
                  example: 1
                building:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Toa nha A
        staffId:
          type: integer
          example: 3
        userId:
          type: integer
          nullable: true
          example: 12

# ── PATHS ──────────────────────────────────────────────────────────────────
paths:

  # ── AUTH ──────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      description: Creates a new account with role `user` by default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password]
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Nguyen Van A
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: Must contain at least one uppercase letter, one lowercase letter, and one digit
                  example: Password1
                phone:
                  type: string
                  example: '0901234567'
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: Password1
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Tokens'
        '401':
          description: Invalid credentials or account inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Tokens'
        '401':
          description: Invalid or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── AUTH ─────────────────────────────────────────────
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change current user password
      description: Changes the authenticated user's password after verifying the current password. Returns fresh access and refresh tokens.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              properties:
                currentPassword:
                  type: string
                  example: Password1
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 128
                  example: NewPassword1
                confirmPassword:
                  type: string
                  description: Must match newPassword
                  example: NewPassword1
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Tokens'
        '400':
          description: Validation error, incorrect current password, or new password matches current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── USERS ─────────────────────────────────────────────
  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [Users]
      summary: Update own profile (fullName and/or phone only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Nguyen Van B
                phone:
                  type: string
                  example: '0901234567'
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    get:
      tags: [Users]
      summary: Get all users (admin, manager)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/queryPage'
        - $ref: '#/components/parameters/queryLimit'
        - name: search
          in: query
          schema:
            type: string
          description: Search by fullName or email
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, manager, staff, user]
        - $ref: '#/components/parameters/queryIsActive'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [fullName, email, role, createdAt]
            default: createdAt
        - $ref: '#/components/parameters/querySortOrder'
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID (admin, manager)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [Users]
      summary: Update user info by ID (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Nguyen Van B
                email:
                  type: string
                  format: email
                  example: newmail@example.com
                phone:
                  type: string
                  example: '0901234567'
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Users]
      summary: Delete user by ID (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '204':
