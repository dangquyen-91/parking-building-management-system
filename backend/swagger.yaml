  # -- VEHICLES --
  /vehicles:
    post:
      tags: [Vehicles]
      summary: Dang ky xe moi (bien so cua toi)
      description: |
        Luu bien so xe vao danh sach "xe cua toi", doc lap voi viec mua goi/booking.
        Bien so la duy nhat tren toan he thong (1 bien so = 1 chu xe).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [licensePlate, vehicleType]
              properties:
                licensePlate:
                  type: string
                  pattern: '^[A-Z0-9\\-]+$'
                  minLength: 4
                  maxLength: 20
                  example: '30A-12345'
                vehicleType:
                  type: string
                  enum: [motorcycle, car]
                  example: car
                nickname:
                  type: string
                  maxLength: 50
                  example: Xe di lam
      responses:
        '201':
          description: Vehicle da duoc dang ky
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Vehicle'
        '400': { description: 'Validation error' }
        '401': { description: 'Unauthorized' }
        '409': { description: 'Bien so da duoc dang ky boi tai khoan khac' }

  /vehicles/me:
    get:
      tags: [Vehicles]
      summary: Danh sach xe cua user dang dang nhap
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List vehicles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Vehicle'
        '401': { description: 'Unauthorized' }

  /vehicles/{id}:
    patch:
      tags: [Vehicles]
      summary: Cap nhat xe cua toi (owner only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                licensePlate:
                  type: string
                  pattern: '^[A-Z0-9\\-]+$'
                  minLength: 4
                  maxLength: 20
                vehicleType:
                  type: string
                  enum: [motorcycle, car]
                nickname:
                  type: string
                  maxLength: 50
      responses:
        '200':
          description: Vehicle updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Vehicle'
        '400': { description: 'Validation error' }
        '403': { description: 'Not the owner' }
        '404': { description: 'Vehicle not found' }
        '409': { description: 'Bien so da duoc dang ky boi tai khoan khac' }

    delete:
      tags: [Vehicles]
      summary: Xoa xe cua toi (owner only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '204': { description: 'Da xoa' }
        '403': { description: 'Not the owner' }
        '404': { description: 'Vehicle not found' }

