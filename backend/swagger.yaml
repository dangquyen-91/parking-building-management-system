  # -- FLOORS --
  /floors:
    get:
      tags: [Floors]
      summary: Get all floors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/queryPage'
        - $ref: '#/components/parameters/queryLimit'
        - name: buildingId
          in: query
          schema:
            type: integer
          description: Filter by building
        - name: vehicleType
          in: query
          schema:
            type: string
            enum: [motorcycle, car]
          description: Lọc theo loại xe (car / motorcycle)
        - name: floorType
          in: query
          schema:
            type: string
            enum: [resident, visitor]
          description: Lọc theo loại tầng (cư dân / vãng lai)
        - $ref: '#/components/parameters/queryIsActive'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [floorNumber, vehicleType, floorType, totalSlots, createdAt]
            default: floorNumber
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
      responses:
        '200':
          description: Paginated list of floors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFloors'
        '400':
          description: Invalid vehicleType filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Floors]
      summary: Create a new floor (admin, manager)
      description: |
        `vehicleType` quyet dinh loai don vi quan ly cho tang:
        - `car` → dung POST /parking-slots de tao o do xe
        - `motorcycle` → dung POST /parking-rows de tao day do xe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buildingId, floorNumber, vehicleType, floorType, totalSlots]
              properties:
                buildingId:
                  type: integer
                  example: 1
                floorNumber:
                  type: integer
                  example: 1
                vehicleType:
                  type: string
                  enum: [motorcycle, car]
                  example: motorcycle
                  description: |
                    Loại xe cho tầng này.
                    - `car` → tạo ô đậu xe bằng POST /parking-slots
                    - `motorcycle` → tạo dãy đậu xe bằng POST /parking-rows
                floorType:
                  type: string
                  enum: [resident, visitor]
                  example: resident
                  description: |
                    Phân loại đối tượng sử dụng tầng.
                    - `resident` → cư dân (check-in yêu cầu userId)
                    - `visitor`  → vãng lai (check-in không được có userId)
                totalSlots:
                  type: integer
                  minimum: 1
                  example: 5
                  description: Số ô xe tối đa (car) hoặc tổng sức chứa tối đa (motorcycle)
                description:
                  type: string
                  maxLength: 1000
                  nullable: true
                  example: Tầng 1 - Xe máy cư dân
                isActive:
                  type: boolean
                  default: true
            examples:
              residentMotorcycle:
                summary: Tầng xe máy cư dân
                value:
                  buildingId: 1
                  floorNumber: 1
                  vehicleType: motorcycle
                  floorType: resident
                  totalSlots: 100
              visitorCar:
                summary: Tầng xe hơi vãng lai
                value:
                  buildingId: 1
                  floorNumber: 4
                  vehicleType: car
                  floorType: visitor
                  totalSlots: 50
      responses:
        '201':
          description: Floor created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Floor'
        '400':
          description: Validation error or building inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Building not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Floor number already exists in this building
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

