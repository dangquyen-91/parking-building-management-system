        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Row not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            - rowCode da ton tai tren tang nay
            - Tong capacity sau khi update vuot qua floor.totalSlots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rowCodeConflict:
                  summary: Ma day da ton tai
                  value:
                    success: false
                    message: 'Row code "A2" already exists on this floor'
                capacityExceeded:
                  summary: Tong capacity vuot qua gioi han tang sau khi update
                  value:
                    success: false
                    message: 'Floor capacity exceeded. Other rows: 80, updating to: 40, max: 100'

    delete:
