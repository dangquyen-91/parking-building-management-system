                rowCode:
                  type: string
                  minLength: 1
                  maxLength: 20
                  example: A2
                capacity:
                  type: integer
                  minimum: 1
                  maximum: 500
                  example: 40
                  description: Khong the nho hon occupiedCount hien tai
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
